streams:
  user_trips:
    query: |
      SELECT trips.* FROM trips
      JOIN trip_members tm ON tm.trip_id = trips.id
      WHERE tm.user_id = auth.user_id() AND tm.status = 'active'
    auto_subscribe: true

  user_trip_participants:
    query: |
      SELECT participants.* FROM participants
      JOIN trip_members tm ON tm.trip_id = participants.trip_id
      WHERE tm.user_id = auth.user_id() AND tm.status = 'active'
    auto_subscribe: true

  user_trip_expenses:
    query: |
      SELECT expenses.* FROM expenses
      JOIN trip_members tm ON tm.trip_id = expenses.trip_id
      WHERE tm.user_id = auth.user_id() AND tm.status = 'active'
    auto_subscribe: true

  user_trip_activity_log:
    query: |
      SELECT trip_activity_log.* FROM trip_activity_log
      JOIN trip_members tm ON tm.trip_id = trip_activity_log.trip_id
      WHERE tm.user_id = auth.user_id() AND tm.status = 'active'
    auto_subscribe: true

  user_expense_splits:
    query: |
      SELECT expense_splits.* FROM expense_splits
      JOIN expenses e ON e.id = expense_splits.expense_id
      JOIN trip_members tm ON tm.trip_id = e.trip_id
      WHERE tm.user_id = auth.user_id() AND tm.status = 'active'
    auto_subscribe: true

config: {edition: 3}
