# Expensio — PowerSync sync rules
#
# Paste this into the PowerSync dashboard's Sync Rules editor (Sync Rules or
# Sync Streams, depending on your instance version — this file works as
# either, the underlying bucket_definitions format is unchanged). Real,
# per-user-scoped sync — NOT the spike's earlier "SELECT * FROM spike_items"
# global bucket, which had no per-user filtering at all.
#
# Two bucket definitions because PowerSync data queries require a DIRECT
# column match against the bucket parameter — no joins allowed in a data
# query (see docs.powersync.com, "Organize Data Into Buckets"). expenses,
# participants, and trip_activity_log all carry trip_id directly, so one
# bucket keyed by trip_id covers them. expense_splits does NOT have a
# trip_id column (only expense_id) — rather than denormalize a redundant
# trip_id onto it (which would mean touching the already-tested
# 0002_core_schema.sql), it gets its own bucket keyed by expense_id instead,
# with the JOIN happening in the PARAMETER query, where joins ARE allowed.
#
# Deliberately NOT synced yet, to keep this first real slice's scope
# contained: trip_invites, custom_categories, expense_comments,
# expense_attachments, ledger_entries, expense_templates. Each is a
# straightforward addition later — trip_invites and custom_categories slot
# into the user_trips bucket below (both carry trip_id directly);
# expense_comments and expense_attachments slot into user_expense_children
# the same way expense_splits does (both carry expense_id, not trip_id).

bucket_definitions:
  user_trips:
    parameters: select trip_id from trip_members where user_id = request.user_id() and status = 'active'
    data:
      - select * from trips where id = bucket.trip_id
      - select * from participants where trip_id = bucket.trip_id
      - select * from expenses where trip_id = bucket.trip_id
      - select * from trip_activity_log where trip_id = bucket.trip_id

  user_expense_children:
    parameters: |
      select e.id as expense_id from expenses e
      join trip_members tm on tm.trip_id = e.trip_id
      where tm.user_id = request.user_id() and tm.status = 'active'
    data:
      - select * from expense_splits where expense_id = bucket.expense_id
